name: Python Schedule App

on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"
  workflow_dispatch:  # 建議加上，方便手動觸發測試

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code        # ✅ 第一步：先 checkout
        uses: actions/checkout@v2

      - name: Set up Python         # ✅ 第二步：再設定 Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'     # ✅ 加引號

      - name: Install dependencies  # ✅ 第三步：安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4  # ✅ 套件名稱小寫

      - name: Run Python script     # ✅ 最後執行腳本
        run: python test1.py
